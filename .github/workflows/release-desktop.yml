name: Release Desktop

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release"
        required: true

permissions:
  contents: write

jobs:
  jar:
    name: Build JAR + create release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        working-directory: desktop-app
        run: ./mvnw -B clean package -DskipTests

      - name: Générer le changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..HEAD")
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publier sur GitHub Releases
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: ${{ github.event.inputs.tag || github.ref_name }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: desktop-app/target/quartierconnect-desktop.jar
          generate_release_notes: true
          body: |
            ## QuartierConnect Desktop ${{ github.event.inputs.tag || github.ref_name }}

            ### Installateurs natifs
            Téléchargez le paquet correspondant à votre système ci-dessous :
            - **Linux** : `quartierconnect-linux.deb` → `sudo apt install ./quartierconnect-linux.deb` (résout les dépendances ; `dpkg -i` ne le fait pas)
            - **Windows** : `quartierconnect-windows.msi` → double-clic
            - **macOS** : `quartierconnect-macos.dmg` → glisser dans Applications

            ### Sans installation (JAR)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/latest/download/quartierconnect-desktop.jar
            java -jar quartierconnect-desktop.jar
            ```

            ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installers:
    name: Installateur ${{ matrix.type }} (${{ matrix.os }})
    needs: jar
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the .deb on 22.04: 24.04's dpkg-shlibdeps emits time64 names
          # (libasound2t64) that don't exist on 22.04/Debian, making the package
          # uninstallable there. 22.04 emits the portable pre-t64 names.
          - os: ubuntu-22.04
            type: deb
            asset: quartierconnect-linux.deb
            script: bash desktop-app/packaging/jpackage-build.sh deb
          - os: macos-latest
            type: dmg
            asset: quartierconnect-macos.dmg
            script: bash desktop-app/packaging/jpackage-build.sh dmg
          - os: windows-latest
            type: msi
            asset: quartierconnect-windows.msi
            script: desktop-app/packaging/jpackage-build.ps1

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Calculer la version
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Smoke-test app-image (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          QC_SMOKE_TEST: "1"
        run: |
          bash desktop-app/packaging/jpackage-build.sh app-image
          if [ "$RUNNER_OS" = "macOS" ]; then
            "desktop-app/target/installer/QuartierConnect.app/Contents/MacOS/QuartierConnect" > smoke.log 2>&1
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a "desktop-app/target/installer/QuartierConnect/bin/QuartierConnect" > smoke.log 2>&1
          fi
          echo "--- sortie de l'app ---"; cat smoke.log
          grep -q "SMOKE_TEST_OK" smoke.log

      - name: Smoke-test app-image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          QC_SMOKE_TEST: "1"
        run: |
          powershell -File desktop-app/packaging/jpackage-build.ps1 app-image
          & "desktop-app/target/installer/QuartierConnect/QuartierConnect.exe" *> smoke.log
          Write-Host "--- sortie de l'app ---"; Get-Content smoke.log
          if (-not (Select-String -Path smoke.log -Pattern "SMOKE_TEST_OK" -Quiet)) {
            throw "Smoke-test échoué : marqueur SMOKE_TEST_OK introuvable"
          }

      - name: Build installateur (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          QC_SERVER_URL: ${{ vars.QC_SERVER_URL }}
        run: ${{ matrix.script }}

      - name: Build installateur (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          QC_SERVER_URL: ${{ vars.QC_SERVER_URL }}
        run: ${{ matrix.script }}

      # Publish under a stable, version-less name so the web app can link to
      # releases/latest/download/<asset> without knowing the version.
      - name: Renommer en nom stable
        shell: bash
        run: mv desktop-app/target/installer/*.${{ matrix.type }} "desktop-app/target/installer/${{ matrix.asset }}"

      - name: Attacher l'installateur à la release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: desktop-app/target/installer/${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Publier SHA256SUMS
    needs: [jar, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Télécharger tous les assets de la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release download "$TAG" --dir dist

      - name: Générer SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publier SHA256SUMS sur la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/SHA256SUMS --clobber
