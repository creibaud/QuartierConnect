# fail2ban — Caddy authentication failure filter
#   cp ops/fail2ban-filter-caddy-auth.conf /etc/fail2ban/filter.d/caddy-auth.conf
#
# Matches Caddy JSON access logs: a 401 response on /api/auth/login.
# Adjust the regex if the Caddy log format differs (versions / fields).
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/api/auth/login".*"status":401.*$
            ^.*"status":401.*"uri":"/api/auth/login".*"remote_ip":"<HOST>".*$
ignoreregex =
