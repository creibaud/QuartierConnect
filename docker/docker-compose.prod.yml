# Production overrides — layered on top of docker-compose.yml:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --build
#
# Aimed at running on a single-host VPS: auto-restart, bounded logs, and memory
# limits so a runaway container can't take the whole host down. Topology still
# lives in docker-compose.yml.
#
# Memory limits target a 4-8 GB VPS (caps add up to ~3.5 GB, the rest is for the
# host). Tune `deploy.resources.limits.memory` to your machine. `deploy.resources`
# is honoured by docker compose v2 outside swarm.
# No hard CPU limit: CPU contention slows things down without crashing, and
# throttling the Neo4j JVM or the databases would do more harm than good.

services:
  api:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  client:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 192m

  admin:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 192m

  docs-user:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64m

  docs-dev:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64m

  mongo:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  neo4j:
    restart: unless-stopped
    # Pin heap + pagecache so the JVM stays under the cgroup limit below.
    # Otherwise Neo4j sizes its heap from host RAM and gets OOM-killed as soon
    # as the container limit is lower.
    environment:
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1280m
        reservations:
          memory: 640m

  postgres:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  caddy:
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      DOCS_AUTH_USER: ${DOCS_AUTH_USER:?DOCS_AUTH_USER is required in production}
      DOCS_AUTH_HASH: ${DOCS_AUTH_HASH:?DOCS_AUTH_HASH is required in production}
    volumes:
      - /var/log/quartierconnect/caddy:/var/log/caddy
      - ./downloads:/srv/downloads:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
